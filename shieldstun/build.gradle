plugins {
    id "com.modrinth.minotaur" version "2.+"
}

base.archivesName = "shieldstun"

loom {
    mods {
        "shieldstun" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    api project(path: ":shieldstun-api")
    include project(path: ":shieldstun-api")

    modImplementation(include("me.lucko:fabric-permissions-api:${project.permissions_api_version}")) {
        exclude group: "net.fabricmc.fabric-api"
    }
}

var isStable = project.is_stable == "true"

if (System.getenv("MODRINTH")) {
    modrinth {
        token = System.getenv("MODRINTH")
        projectId = 'xZK7iTeY'
        versionNumber = "" + version
        versionType = isStable ? "release" : "beta"
        uploadFile = remapJar
        gameVersions = [((String) project.minecraft_version)]
        changelog = System.getenv("CHANGELOG")
        loaders = ["fabric", "quilt"]
    }

    remapJar {
        finalizedBy project.tasks.modrinth
    }
}
